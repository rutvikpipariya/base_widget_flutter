name: base_widget_flutter
description: >-
  Scaffold wrapper with a blurred loading overlay, pull-to-refresh, loading /
  empty / error states, text styles, hex colours, SVG, API and prefs helpers.
version: 2.1.0
homepage: https://github.com/rutvikpipariya/base_widget_flutter
repository: https://github.com/rutvikpipariya/base_widget_flutter
issue_tracker: https://github.com/rutvikpipariya/base_widget_flutter/issues

topics:
  - widget
  - scaffold
  - loading
  - state
  - ui

screenshots:
  - description: base_widget_flutter, one base widget for every screen.
    path: screenshots/banner.png
  - description: BaseStateView switching between loading, empty, error and content.
    path: screenshots/demo/states.gif
  - description: Blurred loading overlay with a message.
    path: screenshots/overlay.png
  - description: An orders list with pull-to-refresh, shown by BaseStateView.
    path: screenshots/states.png

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_local_notifications: ^22.0.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
